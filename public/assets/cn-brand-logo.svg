<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" fill="none" preserveAspectRatio="xMinYMid meet">
  <!-- Crest: Sword & Shield (Centered on X=110, Y=130) -->
  <g id="shield-emblem">
    <!-- Sword Tip Piercing Out Bottom -->
    <path d="M103 216 L117 216 L110 252 Z" fill="currentColor" />

    <!-- Outer Shield Border -->
    <path 
      d="M36 94 L184 94 L184 186 L110 226 L36 186 Z" 
      fill="none" 
      stroke="currentColor" 
      stroke-width="7" 
      stroke-linejoin="miter" 
    />

    <!-- Inner Solid Shield -->
    <path 
      d="M44 101 L176 101 L176 182 L110 218 L44 182 Z" 
      fill="currentColor" 
    />

    <!-- Five Stars in Arch Across Top -->
    <!-- Star 1 -->
    <polygon 
      points="68,114 70,119 75,119.5 71,123 72,128 68,125 64,128 65,123 61,119.5 66,119" 
      fill="white" 
    />
    <!-- Star 2 -->
    <polygon 
      points="89,110 91,115 96,115.5 92,119 93,124 89,121 85,124 86,119 82,115.5 87,115" 
      fill="white" 
    />
    <!-- Star 3 (Center - Highest) -->
    <polygon 
      points="110,107 112,112 117,112.5 113,116 114,121 110,118 106,121 107,116 103,112.5 108,112" 
      fill="white" 
    />
    <!-- Star 4 -->
    <polygon 
      points="131,110 133,115 138,115.5 134,119 135,124 131,121 127,124 128,119 124,115.5 129,115" 
      fill="white" 
    />
    <!-- Star 5 -->
    <polygon 
      points="152,114 154,119 159,119.5 155,123 156,128 152,125 148,128 149,123 145,119.5 150,119" 
      fill="white" 
    />

    <!-- Stylized Monogram "CN" in White -->
    <!-- Letter C -->
    <path 
      d="M100 126 L63 126 L55 134 L55 186 L63 194 L100 194 L100 178 L72 178 L68 174 L68 146 L72 142 L100 142 Z" 
      fill="white" 
    />

    <!-- Letter N -->
    <path 
      d="M103 126 L120 126 L143 168 L143 126 L164 126 L164 194 L146 194 L123 152 L123 194 L103 194 Z" 
      fill="white" 
    />

    <!-- Sword Hilt (Top) -->
    <!-- Pommel with Inverted Trapezoid & Crown/Cross Motif -->
    <path d="M96 22 L124 22 L119 32 L101 32 Z" fill="currentColor" />
    <path d="M104 25 L106 29 L110 25 L114 29 L116 25 L116 30 L104 30 Z" fill="white" />
    <!-- Handle / Grip -->
    <rect x="103" y="32" width="14" height="42" fill="currentColor" />
    <!-- Horizontal Grip Ridges -->
    <rect x="105" y="38" width="10" height="2" fill="white" />
    <rect x="105" y="45" width="10" height="2" fill="white" />
    <rect x="105" y="52" width="10" height="2" fill="white" />
    <rect x="105" y="59" width="10" height="2" fill="white" />
    <rect x="105" y="66" width="10" height="2" fill="white" />

    <!-- Crossguard (Curving down both sides) -->
    <path 
      d="M74 88 C88 80 98 74 110 74 C122 74 132 80 146 88 C144 92 136 86 126 84 C117 82 110 82 110 84 C110 82 103 82 94 84 C84 86 76 92 74 88 Z" 
      fill="currentColor" 
    />
    <!-- Center collar -->
    <rect x="106" y="74" width="8" height="20" fill="currentColor" />
  </g>

  <!-- Wordmark: Single horizontal line "CHIGOZIE NKWO" exactly matching "CN Brand logo 2.png" -->
  <g id="wordmark" fill="currentColor">
    <text 
      x="214" 
      y="186" 
      font-family="'Oswald', sans-serif" 
      font-size="112" 
      font-weight="700" 
      letter-spacing="0.04em"
    >
      CHIGOZIE NKWO
    </text>
  </g>
</svg>
